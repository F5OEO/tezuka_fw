# Enable only with a fixed 40 MHz TCXO and the TX NCO bitstream loaded.
# No capability register exists in this bitstream: this is an explicit assertion.
FPGA_NCO_SUPPORTED=0
AUTOSTART=0
# Conservative spacing: no sample sequence counter is available in the FPGA.
SAMPLE_SECONDS=2
MIN_SAMPLES=5
FILTER_SAMPLES=16
THRESHOLD_HZ=2
MAX_SPREAD_HZ=5
MAX_ERROR_HZ=10000
# Optional absolute sysfs path to the TX converter rate at the NCO.
# TX_RATE_ATTR=/sys/bus/iio/devices/iio:device0/out_voltage_sampling_frequency
# Also correct the RX carrier (uses out_altvoltage0_RX_LO_frequency and, by
# default, in_voltage_sampling_frequency). Off by default: TX-only remains
# the default behavior.
RX_ENABLE=0
# Optional absolute sysfs path to the RX converter rate (ADC rate before
# Maia/host decimation) at the NCO.
# RX_RATE_ATTR=/sys/bus/iio/devices/iio:device0/in_voltage_sampling_frequency
# RX FTW sign relative to TX (opposite by default per the FPGA convention).
# If a known RX carrier's error approximately doubles instead of vanishing,
# an I/Q swap in the hardware chain reversed the convention: set this to -1.
RX_SIGN=1
