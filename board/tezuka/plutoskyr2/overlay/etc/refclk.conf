# PlutoSky R2 reference clock hardware, read by /etc/init.d/S22refclk and
# by api_controller.sh. Plain shell assignments.
#
# The 40 MHz VCTCXO is locked to the 10 MHz MMCX input by an ADF4001 PLL that
# the FPGA programs and supervises (ADF4001_refctl in the bitstream). The
# state is exposed on EMIO GPIO lines of the zynq_gpio chip, offset
# REFCLK_EMIO_BASE + n.
REFCLK_HW=adf4001
REFCLK_CHIP_LABEL=zynq_gpio
REFCLK_EMIO_BASE=54
REFCLK_O_FORCE_EXT=32      # out: 1 = loop always closed
REFCLK_O_FORCE_INT=34      # out: 1 = loop always open (neither: automatic)
REFCLK_I_PRESENT=33        # in : 10 MHz reference detected
REFCLK_I_CP=35             # in : charge pump active
REFCLK_I_COUNT=36          # in : 16 lines, R divider edges per 102.4 us window
REFCLK_I_LOCK=52           # in : PLL locked (ADF4001 digital lock detect)
REFCLK_I_STATE=53          # in : 2 lines, 0 absent 1 acquire 2 locked 3 recheck
REFCLK_NOMINAL_HZ=10000000
REFCLK_COUNT_EXPECTED=1024
