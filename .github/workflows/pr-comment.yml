name: PR comment

# Separate workflow, triggered by workflow_run rather than being a step in
# CI itself, so it runs with this repo's own GITHUB_TOKEN permissions
# (needed to comment on a PR) regardless of who dispatched the CI run.
on:
  workflow_run:
    workflows: ["CI"]
    types:
      - completed

permissions:
  contents: read
  actions: read
  pull-requests: write

jobs:
  comment:
    name: Comment on PR with artifact link
    runs-on: ubuntu-22.04
    # Only for manual smoke-test dispatches of CI (see main.yml) that
    # succeeded -- tag-push release runs have no associated PR to comment
    # on, and a failed run has no artifacts worth linking.
    if: |
      github.event.workflow_run.event == 'workflow_dispatch' &&
      github.event.workflow_run.conclusion == 'success'
    steps:
      - name: Download PR number
        id: download-pr-number
        uses: actions/download-artifact@v8
        continue-on-error: true
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ github.event.workflow_run.id }}
          name: pr-number
          path: .

      - name: Read PR number
        id: pr
        run: |
          set -euo pipefail
          PR=""
          if [ -f pr-number.txt ]; then
            PR=$(tr -d '[:space:]' < pr-number.txt)
          fi
          echo "number=${PR}" >> "$GITHUB_OUTPUT"

      - name: Comment on PR
        if: steps.pr.outputs.number != ''
        uses: peter-evans/create-or-update-comment@v4
        with:
          issue-number: ${{ steps.pr.outputs.number }}
          body: |
            CI artifacts for this PR are ready.

            Find them under "Artifacts" in the [workflow run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.event.workflow_run.id }}).
