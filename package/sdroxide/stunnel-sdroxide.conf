# TLS front end for sdroxide-server (plain HTTP on 127.0.0.1:4950 -- see
# S65sdroxide), needed only so the browser treats the page as a secure
# context and unlocks the Web Audio API. See S45sdroxide-tls-cert for the
# certificate. sdroxide's own reverse-proxy support (server_main.rs's
# strip_proxy_prefix) is unused here -- this terminates TLS directly rather
# than sitting behind a path-prefixed proxy, so no X-Forwarded-* handling is
# needed on sdroxide's side.
#
# This is currently the only stunnel consumer in this firmware, so it owns
# /etc/stunnel/stunnel.conf outright (replacing the package's own commented-
# out sample) rather than trying to coexist via stunnel's `include` directive.

[sdroxide]
accept = 4951
connect = 127.0.0.1:4950
cert = /tmp/sdroxide-tls/sdroxide.crt
key = /tmp/sdroxide-tls/sdroxide.key
